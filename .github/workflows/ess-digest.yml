name: ESS LINE 告警總覽

on:
  # 2026-08-05：LINE 推播改由公司伺服器本機 app.py 負責（見 app.py 內
  # BackgroundScheduler，09:00/13:00/16:30），避免跟雲端重複發送。
  # 自動排程(schedule)已停用，僅保留 workflow_dispatch 作緊急手動備援。
  # 如需恢復雲端排程，取消下面 schedule 區塊的註解即可（記得同時停用
  # 本機 app.py 的 digest 排程，避免重複推播）。
  # schedule:
  #   - cron: "0 1 * * *"    # 09:00
  #   - cron: "0 5 * * *"    # 13:00
  #   - cron: "30 8 * * *"   # 16:30
  workflow_dispatch: {}   # 緊急手動備援用

concurrency:
  group: ess-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      GMS_URL: ${{ secrets.GMS_URL }}
      GMS_USERNAME: ${{ secrets.GMS_USERNAME }}
      GMS_PASSWORD: ${{ secrets.GMS_PASSWORD }}
      TN_EMAIL: ${{ secrets.TN_EMAIL }}
      TN_PASSWORD: ${{ secrets.TN_PASSWORD }}
      IPVITA_ACCOUNT: ${{ secrets.IPVITA_ACCOUNT }}
      IPVITA_PASSWORD: ${{ secrets.IPVITA_PASSWORD }}
      SOLAREDGE_EMAIL: ${{ secrets.SOLAREDGE_EMAIL }}
      SOLAREDGE_PASSWORD: ${{ secrets.SOLAREDGE_PASSWORD }}
      SEPV_ACCOUNT: ${{ secrets.SEPV_ACCOUNT }}
      SEPV_PASSWORD: ${{ secrets.SEPV_PASSWORD }}
      LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
      LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
      CWA_KEY: ${{ secrets.CWA_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        working-directory: ess-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 寫入 Firebase 金鑰
        working-directory: ess-backend
        run: echo "${{ secrets.FIREBASE_KEY_B64 }}" | base64 -d > firebase-key.json

      - name: 抓取並推送 LINE 告警總覽
        working-directory: ess-backend
        run: python run_fetch.py digest
